<!doctype html>
<html lang="ja">
<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}*{box-sizing:border-box}</style>

<body>
<title>メロディーメモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one narrow column — big live readout, one record button, list of saved pitches below */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#1b2129; --muted:#5d6774; --line:#d5dbe2;
  --accent:#a8670f; --accent-ink:#ffffff; --rec:#c2352b;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b; --surface:#1b2128; --fg:#e7ebf0; --muted:#9aa5b2; --line:#2c343e;
  --accent:#e0a246; --accent-ink:#1b1408; --rec:#ef5b4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1b2128; --fg:#e7ebf0; --muted:#9aa5b2; --line:#2c343e;
  --accent:#e0a246; --accent-ink:#1b1408; --rec:#ef5b4f; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.04em;color:var(--muted)}
.readout{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.note{font-family:var(--mono);font-weight:600;font-size:64px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hz{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec{appearance:none;border:0;cursor:pointer;align-self:center;width:96px;height:96px;border-radius:50%;
  background:var(--rec);color:#fff;font:700 15px var(--body);box-shadow:0 0 0 6px color-mix(in srgb,var(--rec) 18%,transparent)}
.rec.on{animation:pulse 1s ease-in-out infinite}
.rec:focus-visible,button:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:3px}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--rec) 10%,transparent)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.status{text-align:center;color:var(--muted);font-size:13px;min-height:1.6em;margin:0}
.fallback{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 16px;font:600 14px var(--body)}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
h2{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.n{font-family:var(--mono);font-weight:600;font-size:22px;min-width:3.2em}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:0}
.play{appearance:none;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font:700 14px var(--body)}
.del{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 6px}
.empty{color:var(--muted);font-size:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.level{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.level i{display:block;height:100%;width:0;background:var(--muted);transition:width .06s linear}
.level i.ok{background:var(--accent)}.level i.hot{background:var(--rec)}
.knobs{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.knob{display:grid;grid-template-columns:7.5em 1fr 3.2em;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.knob output{font-family:var(--mono);font-size:12px;text-align:right;color:var(--fg)}
.knob input{width:100%;accent-color:var(--accent)}
.knob select{grid-column:2/4;font:600 14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.roll{width:100%;height:150px;display:block;margin-top:6px;border-radius:8px;background:color-mix(in srgb,var(--line) 35%,transparent)}
.seq{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;word-break:break-word;min-height:1.6em}
.seq b{color:var(--fg);font-weight:600}.seq b.now{color:var(--accent)}
.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
li .txt{min-width:0;display:flex;flex-direction:column}
</style>

<div class="wrap">
  <h1>メロディーメモ</h1>

  <section class="readout" aria-live="polite">
    <div class="note" id="note">–</div>
    <div class="hz" id="hz">ワンフレーズ歌ってください</div>
    <div class="level" aria-hidden="true"><i id="level"></i></div>
    <canvas class="roll" id="roll" aria-hidden="true"></canvas>
    <div class="seq" id="seq"></div>
  </section>

  <button class="rec" id="rec" type="button">録音</button>
  <p class="status" id="status">タップで録音 → 歌い終えたらもう一度タップ（最大30秒）</p>

  <section class="knobs">
    <label class="knob">録音の音量<input id="inGain" type="range" min="0" max="100" step="1"><output id="inGainV"></output></label>
    <label class="knob">再生の音量<input id="outGain" type="range" min="0" max="300" step="10"><output id="outGainV"></output></label>
    <label class="knob">再生の高さ<input id="oct" type="range" min="-1" max="2" step="1"><output id="octV"></output></label>
    <label class="knob">再生の音色<select id="tone"><option value="saw">ふつう</option><option value="p2">第二ピークも鳴らす</option></select><span></span></label>
  </section>

  <div class="fallback" id="fallback" hidden>
    <span>この画面ではマイクが使えません。録音した音声ファイルからメロディーを取れます。</span>
    <label class="btn">音声ファイルを選ぶ<input id="file" type="file" accept="audio/*"></label>
  </div>

  <section>
    <h2>保存したメロディー</h2>
    <ul id="list"></ul>
  </section>
</div>

<script>
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const MAX_SEC=30;
const $=id=>document.getElementById(id);
let ctx=null, stream=null, analyser=null, raf=0, timer=0, frames=[], t0=0, recording=false;
let shown=null, playing=null;

const midiOf=hz=>69+12*Math.log2(hz/440);
const hzOf=m=>440*Math.pow(2,(m-69)/12);
const nameOf=m=>{const r=Math.round(m);return NAMES[(r%12+12)%12]+(Math.floor(r/12)-1)};
const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]};

// YIN pitch detection on one frame
function rmsOf(buf){let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length)}
function detect(buf,sr){
  if(rmsOf(buf)<0.006)return 0;
  const minT=Math.floor(sr/1200), maxT=Math.min(Math.floor(sr/65),buf.length>>1), W=buf.length-maxT;
  const d=new Float32Array(maxT+1);
  for(let t=1;t<=maxT;t++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+t];s+=x*x}d[t]=s}
  let run=0,tau=-1;const c=new Float32Array(maxT+1);c[0]=1;
  for(let t=1;t<=maxT;t++){run+=d[t];c[t]=run?d[t]*t/run:1}
  for(let t=minT;t<maxT;t++){if(c[t]<0.15){while(t+1<maxT&&c[t+1]<c[t])t++;tau=t;break}}
  // breathy or hoarse voices rarely dip that low: accept the best dip if it is still clearly periodic
  if(tau<0){let b=minT;for(let t=minT+1;t<maxT;t++)if(c[t]<c[b])b=t;if(c[b]<0.35)tau=b}
  if(tau<1||tau>=maxT)return 0;
  const a=c[tau-1],b=c[tau],g=c[tau+1],den=a-2*b+g;
  const shift=den?(a-g)/(2*den):0;
  return sr/(tau+shift);
}

// Strength of the first 10 harmonics (k × f0) in one frame: Hann window + Goertzel at each multiple
const hannCache={};
function harmonics(buf,sr,hz){
  const N=buf.length,w=hannCache[N]||(hannCache[N]=Float32Array.from({length:N},(_,i)=>0.5-0.5*Math.cos(2*Math.PI*i/(N-1)))),out=[];
  for(let k=1;k<=10;k++){
    const f=k*hz;if(f>sr*0.45){out.push(0);continue}
    const c=2*Math.cos(2*Math.PI*f/sr);let s1=0,s2=0;
    for(let i=0;i<N;i++){const s0=buf[i]*w[i]+c*s1-s2;s2=s1;s1=s0}
    out.push(Math.sqrt(Math.max(0,s1*s1+s2*s2-c*s1*s2)));
  }
  return out;
}

// frames [{t, m, r, h}] (m = fractional midi, 0 = unvoiced; r = rms) -> notes [{m, s, d}]
function segment(fr,zones=[]){
  if(fr.length<3)return[];
  const dt=med(fr.slice(1).map((f,i)=>f.t-fr[i].t))||0.02, gap=Math.max(0.07,dt*2.5);
  const sm=fr.map((f,i)=>{if(!f.m)return 0;const w=[];for(let k=i-2;k<=i+2;k++)if(fr[k]&&fr[k].m)w.push(fr[k].m);return w.length>=3?med(w):0});
  // inside vibrato, follow the centre of the swing (average over one cycle) so a wide vibrato stays one note
  const zoneAt=t=>zones.find(z=>t>=z.s&&t<=z.e);
  const inVib=fr.map(f=>!!zoneAt(f.t));
  const cen=sm.map((v,i)=>{if(!v||!inVib[i])return v;const z=zoneAt(fr[i].t);let a=0,c=0;
    for(let k=i;k>=0&&fr[i].t-fr[k].t<=z.per/2;k--)if(sm[k]){a+=sm[k];c++}
    for(let k=i+1;k<fr.length&&fr[k].t-fr[i].t<=z.per/2;k++)if(sm[k]){a+=sm[k];c++}
    return a/c});
  const raw=[];let cur=null;
  const close=()=>{if(!cur)return;const d=cur.last-cur.s+dt;if(d>=0.09)raw.push({m:Math.round(med(cur.v)),s:cur.s,d,re:cur.re});cur=null};
  fr.forEach((f,i)=>{
    const v=cen[i];
    if(!v){if(cur){if(f.t-cur.last>gap)close();else if(f.t-cur.last>=0.06)cur.dip=true}return}
    const r=f.r||0;
    if(cur&&f.t-cur.last<=gap&&Math.abs(v-med(cur.v.slice(-15)))<0.7){
      // a dip in volume followed by a rise means the same pitch was sung again
      if(r<cur.peak*0.45&&!inVib[i])cur.dip=true;
      if(!(cur.dip&&r>cur.peak*0.7&&f.t-cur.s>0.12)){cur.v.push(v);cur.last=f.t;cur.peak=Math.max(cur.peak,r);return}
    }
    const re=!!(cur&&cur.dip&&f.t-cur.last<=gap);close();cur={s:f.t,last:f.t,v:[v],peak:r,dip:false,re};
  });
  close();
  // short notes an octave off their neighbours are detection slips; short lone leaps are glitches
  const fixed=[];
  raw.forEach((n,i)=>{
    const p=raw[i-1],q=raw[i+1];
    if(n.d<0.25&&(p||q)){
      const ref=p&&q?(p.m+q.m)/2:(p||q).m;
      if(Math.abs(n.m-12-ref)<3)n.m-=12;else if(Math.abs(n.m+12-ref)<3)n.m+=12;
      else if(n.d<0.15&&p&&q&&Math.abs(n.m-p.m)>=7&&Math.abs(n.m-q.m)>=7)return;
    }
    fixed.push(n);
  });
  // averaging across the end of a vibrato can leave a short in-between pitch: fold it into the vibrato note
  const kept=[];
  fixed.forEach((n,i)=>{
    const p=kept[kept.length-1],q=fixed[i+1],z=zones.find(z=>n.s<z.e&&n.s+n.d>z.s);
    if(z&&p&&q&&n.d<z.per&&(n.m-p.m)*(q.m-n.m)>0&&(zoneAt(p.s+p.d-0.05)||zoneAt(q.s+0.05))){p.d=n.s+n.d-p.s;return}
    kept.push(n);
  });
  const out=[];
  for(const n of kept){const p=out[out.length-1];if(p&&p.m===n.m&&!n.re&&n.s-(p.s+p.d)<0.15)p.d=n.s+n.d-p.s;else out.push({...n})}
  return legato(out);
}

// frames -> {notes, curve}: notes start at 0, curve is the sung pitch as [[t·100, midi·100], …]
function analyze(fr){
  // 3-point median removes single-frame octave spikes without flattening vibrato
  const all=[];
  fr.forEach((f,i)=>{if(!f.m)return;const w=[fr[i-1],f,fr[i+1]].filter(x=>x&&x.m).map(x=>x.m);all.push({t:f.t,m:w.length===3?med(w):f.m})});
  const zones=vibZones(all);
  const notes=segment(fr,zones);if(!notes.length)return{notes,curve:[]};
  const base=notes[0].s,end=notes[notes.length-1].s+notes[notes.length-1].d;
  const pts=all.filter(p=>p.t>=base-0.05&&p.t<=end+0.05).map(p=>({t:p.t-base,m:p.m}));
  const out=notes.map(n=>{
    const o={m:n.m,s:+(n.s-base).toFixed(3),d:+n.d.toFixed(3)};
    // the vibrato stretch that overlaps this note the most, clipped to the note
    let best=null,bo=0.2;
    for(const z of zones){const ov=Math.min(z.e,n.s+n.d)-Math.max(z.s,n.s);if(ov>bo){bo=ov;best=z}}
    if(best)o.vib={s:+(Math.max(best.s,n.s)-base).toFixed(2),e:+(Math.min(best.e,n.s+n.d)-base).toFixed(2),rate:best.rate,depth:best.depth};
    // voice colour: average harmonic strengths over the note; the second peak is the strongest one after the fundamental
    const hs=fr.filter(f=>f.h&&f.t>=n.s&&f.t<=n.s+n.d&&Math.abs(f.m-n.m)<3).map(f=>f.h);
    if(hs.length>=3){
      const avg=hs[0].map((_,k)=>hs.reduce((a,h)=>a+h[k],0)/hs.length),mx=Math.max(...avg);
      if(mx>0){
        o.h=avg.map(v=>+(v/mx).toFixed(2));
        let k2=1;for(let k=2;k<avg.length;k++)if(avg[k]>avg[k2])k2=k;
        if(avg[k2]>0&&avg[0]>0)o.p2={k:k2+1,a:+Math.min(4,avg[k2]/avg[0]).toFixed(2)};
      }
    }
    return o});
  const curve=[];let lastT=-1;
  for(const p of pts){if(p.t-lastT<0.019)continue;lastT=p.t;curve.push([Math.round(p.t*100),Math.round(p.m*100)])}
  return{notes:out,curve};
}
const curvePts=c=>(c||[]).map(([t,m])=>({t:t/100,m:m/100}));

// Vibrato: stretches where the pitch swings regularly at 4–8.5 Hz by 0.3–5 semitones peak to peak.
// pts [{t, m}] -> zones [{s, e, rate, depth, per}] (seconds, Hz, cents peak-to-peak, period in seconds)
function vibZones(pts){
  const zones=[];let run=[];
  const flush=()=>{if(run.length>1&&run[run.length-1].t-run[0].t>=0.35)zones.push(...zonesIn(run));run=[]};
  for(const p of pts){if(run.length&&p.t-run[run.length-1].t>0.08)flush();run.push(p)}
  flush();return zones;
}
function zonesIn(seg){
  // resample to 100 Hz
  const xs=[],t0=seg[0].t;let j=0;
  for(let t=t0;t<=seg[seg.length-1].t;t+=0.01){
    while(j<seg.length-2&&seg[j+1].t<t)j++;
    const a=seg[j],b=seg[j+1]||a;xs.push(b.t>a.t?a.m+(b.m-a.m)*(t-a.t)/(b.t-a.t):a.m);
  }
  // remove the slow pitch movement with a 0.2 s moving average (≈ one vibrato cycle)
  const H=10,x=xs.map((_,i)=>{let s=0,c=0;for(let k=Math.max(0,i-H);k<=Math.min(xs.length-1,i+H);k++){s+=xs[k];c++}return xs[i]-s/c});
  // alternating peaks/troughs with hysteresis
  const ext=[];let dir=0,hi=0,lo=0;
  for(let i=1;i<x.length;i++){
    if(x[i]>x[hi])hi=i;if(x[i]<x[lo])lo=i;
    if(dir>=0&&x[hi]-x[i]>0.12){ext.push(hi);dir=-1;lo=i}
    else if(dir<=0&&x[i]-x[lo]>0.12){ext.push(lo);dir=1;hi=i}
  }
  // runs of half-cycles with vibrato speed and width, each about as wide as the one before
  // (single half-cycles get some slack for frame timing jitter; the average rate is checked below)
  const amp=(a,b)=>Math.abs(x[b]-x[a]);
  const ok=(k)=>{if(!ok0(k))return false;const A=amp(ext[k-1],ext[k]);
    if(k>=2&&ok0(k-1)){const r=A/amp(ext[k-2],ext[k-1]);if(r<0.4||r>2.5)return false}return true};
  // vibrato swings around a steady centre; a run of quick steps (a scale) has a centre that keeps moving
  const ctr=i=>xs[i]-x[i];
  const ok0=(k)=>{const h=(ext[k]-ext[k-1])/100,A=amp(ext[k-1],ext[k]);return h>=0.04&&h<=0.19&&A>=0.3&&A<=5&&Math.abs(ctr(ext[k])-ctr(ext[k-1]))<Math.max(0.4,A*0.3)};
  const out=[];let r=[];
  for(let k=1;k<=ext.length;k++){
    if(k<ext.length&&ok(k)){if(!r.length)r.push(ext[k-1]);r.push(ext[k]);continue}
    if(r.length>=5){
      // regularity is judged on full cycles, which cancels most of the frame jitter of single peaks
      const mh=(r[r.length-1]-r[0])/(r.length-1),cyc=r.slice(2).map((e,i)=>e-r[i]);
      const mc=cyc.reduce((a,b)=>a+b)/cyc.length,cv=Math.sqrt(cyc.reduce((a,h)=>a+(h-mc)**2,0)/cyc.length)/mc;
      if(100/(2*mh)>=4&&100/(2*mh)<=8.5&&cv<=0.25){
        const depth=r.slice(1).reduce((a,e,i)=>a+amp(r[i],e),0)/(r.length-1);
        out.push({s:t0+(r[0]-mh)/100,e:t0+(r[r.length-1]+mh)/100,rate:+(100/(2*mh)).toFixed(1),depth:Math.round(depth*100),per:2*mh/100});
      }
    }
    r=k<ext.length&&ok0(k)?[ext[k-1],ext[k]]:[];
  }
  return out;
}
// sung notes run into each other: stretch each note over short gaps (consonants, breaths)
function legato(notes){
  return notes.map((n,i)=>{const q=notes[i+1];if(!q)return n;const gap=q.s-(n.s+n.d);return gap>0&&gap<0.35?{...n,d:+(q.s-n.s).toFixed(3)}:n});
}

function getCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}

// volume settings: input gain ×1–×20 on a log slider, output 0–150 %
let prefs={in:46,out:150,oct:0,tone:"saw"};
try{Object.assign(prefs,JSON.parse(localStorage.getItem("pitch-memo-prefs")||"{}"))}catch(e){}
const inMul=()=>Math.pow(20,prefs.in/100);
let inNode=null,outNode=null;
// a compressor lets the volume go well past 100% without clipping on phone speakers
function outBus(){
  const c=getCtx();
  if(!outNode){const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=0.003;comp.release.value=0.15;
    outNode=c.createGain();outNode.connect(comp).connect(c.destination)}
  outNode.gain.value=prefs.out/100;return outNode;
}
// after the mic is used iOS keeps routing audio to the quiet call speaker unless told otherwise
function audioMode(type){try{if(navigator.audioSession)navigator.audioSession.type=type}catch(e){}}
function syncPrefs(){
  $("inGain").value=prefs.in;$("outGain").value=prefs.out;$("oct").value=prefs.oct;$("tone").value=prefs.tone;
  $("octV").textContent=prefs.oct?(prefs.oct>0?"+":"−")+Math.abs(prefs.oct)+"oct":"±0";
  $("inGainV").textContent="×"+inMul().toFixed(1);$("outGainV").textContent=prefs.out+"%";
  if(inNode)inNode.gain.value=inMul();if(outNode)outNode.gain.value=prefs.out/100;
  try{localStorage.setItem("pitch-memo-prefs",JSON.stringify(prefs))}catch(e){}
}
$("inGain").addEventListener("input",e=>{prefs.in=+e.target.value;syncPrefs()});
$("outGain").addEventListener("input",e=>{prefs.out=+e.target.value;syncPrefs()});
$("oct").addEventListener("input",e=>{prefs.oct=+e.target.value;syncPrefs()});
$("tone").addEventListener("change",e=>{prefs.tone=e.target.value;syncPrefs()});
syncPrefs();
function level(r){
  const el=$("level"),w=Math.min(100,Math.sqrt(r/0.3)*100);
  el.style.width=w+"%";el.className=r>0.3?"hot":r>0.02?"ok":"";
}

// piano roll
function draw(notes,trace,head,live){
  const cv=$("roll"),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement),acc=cs.getPropertyValue("--accent"),mut=cs.getPropertyValue("--muted"),line=cs.getPropertyValue("--line"),fg=cs.getPropertyValue("--fg");
  const ms=[...(notes||[]).map(n=>n.m),...(trace||[]).filter(f=>f.m).map(f=>f.m)];
  if(!ms.length)return;
  let lo=Math.floor(Math.min(...ms))-2,hi=Math.ceil(Math.max(...ms))+2;if(hi-lo<12){const c=(hi+lo)/2;lo=Math.floor(c-6);hi=lo+12}
  const end=Math.max(1,...(notes||[]).map(n=>n.s+n.d),...(trace||[]).map(f=>f.t)),pad=6;
  const X=t=>pad+t/end*(W-pad*2),rowH=H/(hi-lo+1),Y=m=>H-(m-lo+1)*rowH;
  g.fillStyle=line;for(let m=lo;m<=hi;m++)if([1,3,6,8,10].includes((m%12+12)%12))g.fillRect(0,Y(m),W,rowH);
  if(notes){g.fillStyle=acc;g.globalAlpha=trace&&trace.length?0.55:1;for(const n of notes){g.beginPath();g.roundRect?g.roundRect(X(n.s),Y(n.m)+1,Math.max(3,X(n.s+n.d)-X(n.s)-1),rowH-2,2):g.rect(X(n.s),Y(n.m)+1,Math.max(3,X(n.s+n.d)-X(n.s)-1),rowH-2);g.fill()}g.globalAlpha=1}
  // the pitch actually sung, as a line that breaks over silences
  if(trace){g.strokeStyle=live?mut:fg;g.lineWidth=1.5;g.lineJoin="round";g.beginPath();let prev=null;
    for(const f of trace){if(!f.m){prev=null;continue}const x=X(f.t),y=Y(f.m)+rowH/2;if(prev&&f.t-prev.t<0.1)g.lineTo(x,y);else g.moveTo(x,y);prev=f}g.stroke()}
  // vibrato: a wavy mark over the part of the note where it was sung
  if(notes){g.strokeStyle=acc;g.lineWidth=1.5;for(const n of notes)if(n.vib){
    const x0=X(n.vib.s),x1=Math.max(x0+8,X(n.vib.e)),y=Y(n.m)-5;g.beginPath();
    for(let x=x0;x<=x1;x+=1)g[x===x0?"moveTo":"lineTo"](x,y+2*Math.sin((x-x0)/2.2));g.stroke()}}
  if(head!=null){g.fillStyle=mut;g.fillRect(X(head),0,1.5,H)}
}
function showMelody(item,cur,head){
  const notes=legato(item.notes);
  shown=item;
  const seq=$("seq");seq.textContent="";
  notes.forEach((n,i)=>{const b=document.createElement("b");b.textContent=nameOf(n.m)+(n.vib?"〜":"");if(n.vib)b.title="ビブラート "+n.vib.rate+"Hz・幅"+n.vib.depth+"セント";if(i===cur)b.className="now";seq.append(b," ")});
  $("note").textContent=cur!=null&&notes[cur]?nameOf(notes[cur].m):notes.length+"音";
  const p2=cur!=null&&notes[cur]&&notes[cur].p2;
  const dur=notes.length?notes[notes.length-1].s+notes[notes.length-1].d:0;
  const nv=notes.filter(n=>n.vib).length;
  $("hz").textContent=p2&&prefs.tone==="p2"?"＋ "+nameOf(notes[cur].m+12*Math.log2(p2.k))+"（"+p2.k+"倍音・強さ "+Math.round(p2.a*100)+"%）":dur.toFixed(1)+" 秒"+(nv?" · 〜 ビブラート":"");
  draw(notes,curvePts(item.curve),head);
}

async function start(){
  stopPlay();
  audioMode("play-and-record");
  const c=getCtx();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){$("status").textContent="マイクを使えませんでした。下のファイル選択を使ってください。";$("fallback").hidden=false;return}
  const src=c.createMediaStreamSource(stream);
  inNode=c.createGain();inNode.gain.value=inMul();
  analyser=c.createAnalyser();analyser.fftSize=2048;src.connect(inNode).connect(analyser);
  const buf=new Float32Array(analyser.fftSize);
  frames=[];t0=c.currentTime;recording=true;$("rec").classList.add("on");$("rec").textContent="停止";
  $("status").textContent="録音中… ワンフレーズ歌ってください";$("seq").textContent="";
  let last=-1;
  const loop=()=>{
    const t=c.currentTime-t0;
    if(t!==last){last=t;analyser.getFloatTimeDomainData(buf);const hz=detect(buf,c.sampleRate),r=rmsOf(buf),m=hz?midiOf(hz):0;frames.push({t,m,r,h:hz?harmonics(buf,c.sampleRate,hz):null});level(r);
      $("note").textContent=m?nameOf(m):"…";$("hz").textContent=t.toFixed(1)+" 秒";draw(null,frames,null,true)}
    raf=requestAnimationFrame(loop)};
  loop();timer=setTimeout(stop,MAX_SEC*1000);
}
function stop(){
  if(!recording)return;recording=false;
  cancelAnimationFrame(raf);clearTimeout(timer);
  stream&&stream.getTracks().forEach(t=>t.stop());level(0);
  audioMode("playback");
  $("rec").classList.remove("on");$("rec").textContent="録音";
  finish(frames);
}
function finish(fr){
  const {notes,curve}=analyze(fr);
  if(!notes.length){$("status").textContent="メロディーを検出できませんでした。録音の音量を上げるか、もう少しはっきり歌ってみてください。";$("note").textContent="–";draw(null,fr,null,true);return}
  add(notes,curve);showMelody(saved[0]);
  $("status").textContent=notes.length+"音のメロディーを保存しました";
  playMelody(saved[0]);
}
$("rec").addEventListener("click",()=>recording?stop():start());

$("file").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  $("status").textContent="解析中…";
  try{
    const c=getCtx();const ab=await c.decodeAudioData(await f.arrayBuffer());
    const data=ab.getChannelData(0),sr=ab.sampleRate,N=2048,hop=Math.round(sr*0.02),out=[];
    const end=Math.min(data.length,sr*MAX_SEC);
    for(let i=0;i+N<end;i+=hop){const b=data.slice(i,i+N).map(x=>x*inMul()),hz=detect(b,sr);out.push({t:i/sr,m:hz?midiOf(hz):0,r:rmsOf(b),h:hz?harmonics(b,sr,hz):null})}
    finish(out);
  }catch(err){$("status").textContent="このファイルは読み込めませんでした。m4a / mp3 / wav を試してください。"}
  e.target.value="";
});

// playback
let voices=[],ticks=0;
function stopPlay(){
  voices.forEach(o=>{try{o.stop()}catch(e){}});voices=[];cancelAnimationFrame(ticks);
  if(playing){playing=null;render()}
}
function playMelody(item){
  stopPlay();
  audioMode("playback");
  const c=getCtx(),t0=c.currentTime+0.08,notes=legato(item.notes);
  for(const n of notes){
    // sawtooth through a low-pass: rich in overtones so low notes still carry on a phone speaker
    const f=hzOf(n.m+12*prefs.oct),s=t0+n.s,d=Math.max(0.12,n.d);
    const env=level=>{const g=c.createGain();g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(level,s+0.02);g.gain.setValueAtTime(level,s+d-0.03);g.gain.linearRampToValueAtTime(0,s+d);g.connect(outBus());return g};
    const osc=(type,freq,dest)=>{const o=c.createOscillator();o.type=type;o.frequency.value=freq;o.connect(dest);o.start(s);o.stop(s+d+0.02);voices.push(o);return o};
    if(prefs.tone==="p2"){
      // two pure tones: the sung pitch and the voice's second-strongest component, at their measured balance
      const a=n.p2?n.p2.a:0,sum=1+a;
      osc("sine",f,env(0.5/sum));
      if(n.p2&&f*n.p2.k<c.sampleRate/2)osc("sine",f*n.p2.k,env(0.5*a/sum));
    }else{
      const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=Math.min(5000,f*10);lp.Q.value=0.7;lp.connect(env(0.35));
      osc("sawtooth",f,lp);
    }
  }
  playing=item;render();
  const end=notes[notes.length-1].s+notes[notes.length-1].d;
  const step=()=>{
    const t=c.currentTime-t0;
    if(t>end+0.1){showMelody(item);stopPlay();return}
    let cur=null;notes.forEach((n,i)=>{if(t>=n.s&&t<n.s+n.d)cur=i});
    showMelody(item,cur,Math.max(0,t));
    ticks=requestAnimationFrame(step)};
  step();
}

// saved melodies
let saved=[];
try{saved=JSON.parse(localStorage.getItem("pitch-memo")||"[]")}catch(e){}
saved=saved.map(s=>s.notes?s:{notes:[{m:Math.round(midiOf(s.hz)),s:0,d:1}],t:s.t});
if(!saved.length)saved=[{t:"例",notes:[[60,0,.4],[62,.45,.4],[64,.9,.4],[65,1.35,.4],[67,1.8,.8]].map(([m,s,d])=>({m,s,d}))}];
function persist(){try{localStorage.setItem("pitch-memo",JSON.stringify(saved.filter(s=>s.t!=="例")))}catch(e){}}
function add(notes,curve){const d=new Date();saved=saved.filter(s=>s.t!=="例");saved.unshift({notes,curve,t:d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})});persist();render()}
function render(){
  const ul=$("list");ul.textContent="";
  if(!saved.length){const p=document.createElement("li");p.className="empty";p.textContent="まだありません。歌うとメロディーがここに残ります。";ul.appendChild(p);return}
  saved.forEach((s,i)=>{
    const li=document.createElement("li");
    const txt=document.createElement("span");txt.className="txt";
    const n=document.createElement("span");n.className="n";n.textContent=s.notes.map(x=>nameOf(x.m)).join(" ");
    const last=s.notes[s.notes.length-1];
    const m=document.createElement("span");m.className="meta";m.textContent=s.notes.length+"音 · "+(last.s+last.d).toFixed(1)+"秒 · "+s.t;
    txt.append(n,m);txt.onclick=()=>{stopPlay();showMelody(s)};
    const p=document.createElement("button");p.className="play";p.type="button";
    p.textContent=playing===s?"■ 停止":"▶ 再生";p.onclick=()=>playing===s?stopPlay():playMelody(s);
    const x=document.createElement("button");x.className="del";x.type="button";x.setAttribute("aria-label","削除");x.textContent="×";
    x.onclick=()=>{if(playing===s)stopPlay();saved.splice(i,1);persist();render()};
    li.append(txt,p,x);ul.appendChild(li);
  });
}
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)$("fallback").hidden=false;
render();showMelody(saved[0]);
addEventListener("resize",()=>shown&&showMelody(shown));
</script>
